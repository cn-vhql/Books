services:
  books:
    build: .
    image: koodo-centralized:local
    container_name: koodo-centralized
    restart: unless-stopped
    ports:
      - "18083:8080"
    environment:
      SERVER_USERNAME: ${SERVER_USERNAME:-admin}
      SERVER_PASSWORD_FILE: ${SERVER_PASSWORD_FILE:-books_admin_password}
      ENABLE_HTTP_SERVER: "true"
      ENABLE_LIBRARY_SERVER: "true"
      ENABLE_OPDS: "true"
      STATIC_DIR: /app/build
      PORT: "8080"
    volumes:
      - /vol1/app/Books/data/uploads:/app/uploads
    secrets:
      - books_admin_password
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

secrets:
  books_admin_password:
    file: ./my_secret.txt
