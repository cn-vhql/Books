services:
  books:
    build: .
    image: koodo-centralized:local
    container_name: koodo-centralized
    restart: unless-stopped
    ports:
      - "18083:8080"
    environment:
      SERVER_USERNAME: ${SERVER_USERNAME:-admin}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-ChangeMe_2026!}
      ENABLE_HTTP_SERVER: "true"
      ENABLE_LIBRARY_SERVER: "true"
      ENABLE_OPDS: "true"
      STATIC_DIR: /app/build
      PORT: "8080"
    volumes:
      - /vol1/app/Books/data/uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
